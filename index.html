<!DOCTYPE html>
<html>
<head>
  <title>Momcozy Costa Rica</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: white;
    }

    .desktop {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    .mobile {
      display: none;
    }

    @media (max-width: 768px) {

      .desktop {
        display: none;
      }

      .mobile {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }
    }
  </style>
</head>

<body>

  <img src="comingsoon.jpg" class="desktop">

  <img src="comingsoon-mobile.jpg" class="mobile">

</body>
</html>
