<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momcozy Costa Rica</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100vw;
      height:100vh;
      overflow:hidden;
      background:white;
    }

    picture,
    img{
      width:100%;
      height:100%;
      display:block;
    }

    img{
      object-fit:cover;
    }

  </style>
</head>

<body>

  <picture>

    <source
      media="(max-width: 900px)"
      srcset="comingsoon-mobile.jpg">

    <img
      src="comingsoon.jpg"
      alt="Momcozy Costa Rica">

  </picture>

</body>
</html>
